name: Platform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static, contract, provider, evaluation, and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check immutable workflow dependencies
        run: ./scripts/check-workflow-actions.sh

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm security:audit

      - name: Check architecture fitness rules
        run: pnpm architecture:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify reviewed OpenAPI contract
        run: pnpm contract:check

      - name: Run unit tests
        run: pnpm test

      - name: Verify migration rollback inventory
        run: pnpm exec vitest run tests/migration-pairs.test.ts

      - name: Run API contract tests
        run: pnpm test:contract

      - name: Run provider contract tests
        run: pnpm test:providers

      - name: Run deterministic ticket-quality evaluation
        run: pnpm eval:tickets

      - name: Build production platform artifacts
        run: pnpm build

  postgres:
    name: PostgreSQL repository and API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: axiom_test
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom-local-only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U axiom -d axiom_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check immutable workflow dependencies
        run: ./scripts/check-workflow-actions.sh

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PostgreSQL integration tests
        run: pnpm test:db

      - name: Verify forward and reverse migrations in a disposable database
        run: pnpm db:verify-rollbacks
